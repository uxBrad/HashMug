<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sigil Sandbox</title>
<style>
  body{font:14px system-ui;margin:0;background:#fafafa;color:#111}
  header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:12px 16px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;z-index:1}
  label{display:flex;flex-direction:column;font-size:12px;gap:2px}
  input,select,button{font:inherit;padding:4px}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cell,96px),1fr));gap:12px;padding:16px}
  .item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#555;overflow:hidden}
  .item svg{width:100%;height:auto;display:block}
</style>
</head>
<body>
<header>
  <label>Seed prefix <input id="prefix" value="user"></label>
  <label>How many <input id="count" type="number" value="300" min="1" max="2000"></label>
  <label>Shape <input id="radius" type="range" min="0" max="0.5" step="0.05" value="0.5" title="Left: square. Right: circle."></label>
  <label>Size <input id="cell" type="range" min="48" max="200" step="8" value="96"></label>
  <label>Hair <select id="hair"><option value="">auto</option><option>wave</option><option>slope</option><option>zigzag</option><option>scallop</option><option>straight</option></select></label>
  <label>Gradient hair <select id="gradient"><option value="">auto</option><option value="on">on</option><option value="off">off</option></select></label>
  <label>Pupils <select id="pupils"><option value="">auto</option><option value="on">on</option><option value="off">off</option></select></label>
  <label>Brows <select id="brows"><option value="">auto</option><option value="on">on</option><option value="off">off</option></select></label>
  <label>Mouth <select id="mouth"><option value="">auto</option><option value="on">on</option><option value="off">off</option></select></label>
  <button id="shuffle">New seeds</button>
</header>
<div id="grid"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
